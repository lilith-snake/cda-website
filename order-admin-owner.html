<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CDA 管理员排单后台</title>
    <meta http-equiv="refresh" content="0; url=order-admin.html?admin=1" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e0b18;
        --panel: #1a1428;
        --line: #3c3255;
        --ink: #f7f1ff;
        --muted: #b7acd0;
        --gold: #d4b066;
        --pink: #e76aae;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      }
      main {
        width: min(430px, 100%);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 32px;
      }
      .brand {
        color: var(--gold);
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 800;
      }
      h1 {
        margin: 16px 0 10px;
        font-size: 34px;
        line-height: 1.08;
      }
      p {
        margin: 0 0 22px;
        color: var(--muted);
        line-height: 1.7;
      }
      a {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        padding: 0 16px;
        background: linear-gradient(135deg, #8f5cff, var(--pink) 58%, var(--gold));
        color: white;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">CDA</div>
      <h1>管理员排单后台</h1>
      <p>正在进入管理员登录入口。管理员密码登录后可以删除排单。</p>
      <a href="order-admin.html?admin=1">进入管理员后台</a>
    </main>
  </body>
</html>
