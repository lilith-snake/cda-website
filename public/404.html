<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    // Extract the path and store it for index.html to restore on static hosts.
    var path = location.pathname || '/';
    if (location.search) path += location.search;
    if (location.hash) path += location.hash;
    sessionStorage.setItem('redirect', path);
    location.replace('/');
  </script>
</head>
<body>Redirecting...</body>
</html>
